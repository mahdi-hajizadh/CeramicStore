name: Build and lint

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build CeramicStore.Api/CeramicStore.Api.csproj --configuration Release
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: CeramicStore.Web/package-lock.json
      - run: npm ci
        working-directory: CeramicStore.Web
      - run: npm run lint
        working-directory: CeramicStore.Web
      - run: npm run build
        working-directory: CeramicStore.Web
